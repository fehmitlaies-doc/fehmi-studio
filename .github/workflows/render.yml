# Montage des vidéos Radar (style R7) : lancé par le Studio via Make, rend la vidéo et la dépose dans Dropbox.
name: render
run-name: radar ${{ inputs.name }}
on:
  workflow_dispatch:
    inputs:
      name:
        description: identifiant <page>-<horodatage>
        required: true
        type: string
      job:
        description: plans + voix (JSON en base64)
        required: true
        type: string
      upload:
        description: lien d'envoi Dropbox temporaire
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: render-${{ inputs.name }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
      - name: Cache HyperFrames (Chrome + modèle de transcription)
        uses: actions/cache@v4
        with:
          path: ~/.cache/hyperframes
          key: hyperframes-0.8.199-v1
      - name: Navigateur de rendu
        run: npx -y hyperframes@0.8.199 browser ensure
      # Le dépôt est public : les entrées (voix, lien d'envoi) sont lues dans l'événement, jamais
      # passées en variables d'environnement (affichées dans les journaux), et la vidéo n'est pas archivée ici.
      - name: Montage
        run: bash radar/tools/render.sh
