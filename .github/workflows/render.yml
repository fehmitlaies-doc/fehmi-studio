# Montage des vidéos Radar (style R7) : lancé par le Studio via Make, rend la vidéo et la dépose dans Dropbox.
name: render
run-name: radar ${{ inputs.name }}
on:
  workflow_dispatch:
    inputs:
      name:
        description: identifiant <page>-<horodatage>
        required: true
        type: string
      job:
        description: plans + voix (JSON en base64, gzip possible)
        required: true
        type: string
      upload:
        description: lien d'envoi Dropbox temporaire
        required: false
        type: string
permissions:
  contents: read
concurrency:
  group: render-${{ inputs.name }}
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # ffmpeg : binaire statique (rapide), sinon paquet Ubuntu ; jamais plus de 6 minutes
      - name: ffmpeg
        timeout-minutes: 6
        run: |
          if ! command -v ffmpeg >/dev/null; then
            if curl -fsSL --max-time 120 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o /tmp/ff.tar.xz; then
              tar xJf /tmp/ff.tar.xz -C /tmp && sudo cp /tmp/ffmpeg-*-static/ffmpeg /tmp/ffmpeg-*-static/ffprobe /usr/local/bin/
            else
              sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
            fi
          fi
          ffmpeg -version | head -1
      - name: Cache HyperFrames (Chrome + modèle de transcription)
        uses: actions/cache@v4
        with:
          path: ~/.cache/hyperframes
          key: hyperframes-0.8.199-v1
      - name: Navigateur de rendu
        run: npx -y hyperframes@0.8.199 browser ensure
      # Le dépôt est public : les entrées (voix, lien d'envoi) sont lues dans l'événement, jamais
      # passées en variables d'environnement (affichées dans les journaux), et la vidéo n'est pas archivée ici.
      - name: Montage
        run: bash radar/tools/render.sh
