<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Studio">
<meta name="theme-color" content="#0f1115">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>Fehmi Studio</title>
<style>
/* Mise en page : une liste de scripts à tourner, une feuille « Nouveau script », un plateau plein écran (caméra + prompteur) et une file d'envoi. */
:root{--bg:#0f1115;--card:#181b22;--line:#2a2f3a;--txt:#eef0f4;--mut:#9aa3b2;--acc:#ff4d5e;--ok:#3ecf8e;--warn:#f5b84b;--r:14px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Arabic",sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;border:0;border-radius:12px;padding:12px 16px;background:#262b36;cursor:pointer}
button.pri{background:var(--acc);color:#fff;font-weight:600}
button.ghost{background:transparent;border:1px solid var(--line)}
button:disabled{opacity:.45}
input,textarea,select{font:inherit;color:var(--txt);background:#11141a;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%}
textarea{resize:vertical}
label{display:block;font-size:13px;color:var(--mut);margin:12px 0 4px}
.wrap{max-width:720px;margin:0 auto;padding:12px 16px 120px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0 12px}
h1{font-size:22px;margin:0}
.seg{display:flex;background:#151820;border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{padding:7px 12px;border-radius:9px;background:transparent;font-size:14px}
.seg button.on{background:#2c3240}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin:10px 0;display:flex;gap:12px;align-items:flex-start}
.card input[type=checkbox]{width:24px;height:24px;margin-top:2px;flex:none;accent-color:var(--acc)}
.card .b{flex:1;min-width:0}
.card .t{font-weight:600;margin-bottom:4px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:12px;color:var(--mut)}
.pill{border:1px solid var(--line);border-radius:99px;padding:1px 8px}
.pill.warn{border-color:var(--warn);color:var(--warn)}
.pill.ok{border-color:var(--ok);color:var(--ok)}
.go{flex:none;padding:10px 14px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(15,17,21,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);display:flex;gap:10px;justify-content:center;z-index:5}
.bar button{flex:1;max-width:340px}
.empty{color:var(--mut);text-align:center;padding:40px 10px}
.err{background:#3a1a1f;border:1px solid #6b2a33;color:#ffd5da;border-radius:12px;padding:10px 12px;margin:10px 0}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--card);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.row{display:flex;gap:10px;align-items:center}
.row>*{flex:1}
.small{font-size:13px;color:var(--mut)}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);background:#262b36;border:1px solid var(--line);padding:10px 16px;border-radius:12px;z-index:60;max-width:90vw}
.queue{margin-top:18px}
.q{font-size:14px;display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.q .st{color:var(--mut);white-space:nowrap}
.q .st.ok{color:var(--ok)}.q .st.bad{color:var(--acc)}
/* plateau */
#stage{position:fixed;inset:0;background:#000;z-index:40;display:none}
#stage.on{display:block}
#cam,#play{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#cam{transform:scaleX(-1)}
#play{display:none}
#prompt{position:absolute;left:0;right:0;top:0;height:42%;overflow:hidden;background:linear-gradient(rgba(0,0,0,.72),rgba(0,0,0,.55) 80%,rgba(0,0,0,0));padding:calc(12px + env(safe-area-inset-top)) 18px 0}
#ptext{white-space:pre-wrap;font-weight:600;line-height:1.35;will-change:transform;text-shadow:0 1px 2px #000}
#ptext.ar{direction:rtl;text-align:right;font-family:"Noto Sans Arabic","Geeza Pro",sans-serif}
#guide{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top) + 64px);border-top:2px solid rgba(255,77,94,.55);pointer-events:none}
#hud{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.7) 35%)}
#hud .row button{padding:10px}
#rec{width:78px;height:78px;border-radius:50%;background:transparent;border:5px solid #fff;padding:0;flex:none;display:grid;place-items:center;margin:0 auto}
#rec i{display:block;width:56px;height:56px;border-radius:50%;background:var(--acc);transition:.2s}
#rec.on i{width:30px;height:30px;border-radius:8px}
#count{position:absolute;inset:0;display:none;place-items:center;font-size:120px;font-weight:800;color:#fff;text-shadow:0 2px 12px #000;pointer-events:none}
#info{position:absolute;right:12px;top:calc(46% );background:rgba(0,0,0,.55);border-radius:10px;padding:4px 10px;font-size:13px}
#info .dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--acc);margin-right:6px;animation:bl 1s infinite}
@keyframes bl{50%{opacity:.2}}
#review{display:none;gap:10px}
#ptext{padding-top:52px;padding-bottom:60vh}
.card .t{cursor:pointer}
.vbox{margin-top:8px}
.vbox video{width:100%;max-height:70vh;border-radius:12px;background:#000;display:block;margin-bottom:6px}
.vbox .vplay{width:100%;padding:10px}
.links a{color:#8fb8ff;margin-right:10px;word-break:break-all}
#hookPrev{position:absolute;left:8%;right:8%;top:22%;text-align:center;font-weight:900;font-size:30px;line-height:1.25;pointer-events:none;display:none}
#hookPrev span{background:#ffe14d;color:#111;padding:2px 10px;border-radius:8px;box-decoration-break:clone;-webkit-box-decoration-break:clone}
#hookChip{background:rgba(255,225,77,.16);border:1px solid #ffe14d;color:#ffe14d;border-radius:10px;padding:6px 10px;font-size:13px;text-align:left}
#fx{position:fixed;inset:0;background:#000;z-index:45;display:none}
#fx.on{display:block}
#fxc,#fxv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
#fxv{display:none}
#fxhud{position:absolute;left:0;right:0;bottom:0;padding:12px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.8) 30%)}
#fxSteps div{padding:2px 0}
.hudtop{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:14px}
/* Radar et voix seule */
.idea .ab{font-size:14px;color:var(--txt);background:#11141a;border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:8px;white-space:pre-wrap}
.idea .ab b{color:var(--warn)}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.acts button{flex:1;padding:9px 10px;font-size:14px}
#stage.audio{background:#17121C}
#stage.audio #cam{display:none!important}
#stage.audio #prompt{height:70%;background:none}
#stage.audio #flip,#stage.audio #hookChip{display:none!important}
#stage.audio #play{height:80px;top:auto;bottom:220px}
.sayplan{margin:0 0 6px;padding:8px 10px;border-left:3px solid #F2A541;background:#11141a;border-radius:8px;font-size:14px}
.sayplan small{display:block;color:var(--mut);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="seg" id="tabs"><button data-t="shoot" class="on">🎬 Tourner</button><button data-t="radar">📡 Radar</button><button data-t="track">📊 Suivi</button></div>
    <div class="seg" id="langSeg">
      <button data-l="all">Tout</button><button data-l="Francais">FR</button><button data-l="عربي">AR</button>
    </div>
  </header>
  <div id="msg"></div>
  <div id="list"></div>
  <div id="radar" hidden></div>
  <div id="track" hidden></div>
  <div class="queue" id="queue"></div>
</div>

<div class="bar">
  <button class="ghost" id="bNew">＋ Scripts</button>
  <button class="ghost" id="bDel" hidden style="flex:none">🗑 0</button>
  <button class="pri" id="bShoot" disabled>Tourner (0)</button>
</div>

<!-- plateau : caméra + prompteur -->
<div id="stage">
  <video id="cam" playsinline muted autoplay></video>
  <video id="play" playsinline controls></video>
  <div id="prompt"><div id="ptext"></div></div>
  <div id="guide"></div>
  <div id="count"></div>
  <div id="hookPrev" dir="auto"></div>
  <div id="info" hidden></div>
  <div id="hud">
    <div class="hudtop"><span id="hTitle"></span><span id="hPos"></span></div>
    <button id="hookChip" aria-label="Modifier l'accroche à l'écran"></button>
    <div id="live">
      <div class="row">
        <button id="sSlow" aria-label="Plus lent">🐢</button>
        <button id="sFast" aria-label="Plus rapide">🐇</button>
        <button id="fMinus" aria-label="Texte plus petit">A−</button>
        <button id="fPlus" aria-label="Texte plus grand">A＋</button>
        <button id="pPause" aria-label="Pause du prompteur">⏯</button>
        <button id="flip" aria-label="Changer de caméra">🔄</button>
      </div>
      <div class="row" style="margin-top:12px">
        <button class="ghost" id="sClose">Fermer</button>
        <button id="rec" aria-label="Enregistrer"><i></i></button>
        <button class="ghost" id="sSkip">Passer</button>
      </div>
    </div>
    <div id="review" class="row">
      <button class="ghost" id="rRedo">↺ Refaire</button>
      <button class="pri" id="rKeep">✓ Garder & publier</button>
    </div>
  </div>
</div>

<!-- producteur sans visage : voix clonée + images IA + montage dans le navigateur -->
<div id="fx">
  <canvas id="fxc" width="1080" height="1920"></canvas>
  <video id="fxv" playsinline controls></video>
  <div id="fxhud">
    <div class="hudtop"><span id="fxTitle"></span></div>
    <div id="fxSteps" class="small"></div>
    <div class="row" id="fxBtns"></div>
  </div>
</div>
<div id="sheet"></div>
<div class="toast" id="toast" hidden></div>

<script>
const API = "https://hook.eu1.make.com/0jj57vomxlae4srwpwj6m74kdrkk24p2";
// Mise à jour automatique : l'iPhone garde l'ancienne page en cache ; on compare avec la version en ligne et on recharge
const BUILD = "2026-10-26.8";
async function checkUpdate() {
  try {
    const t = await (await fetch(location.pathname + "?v=" + Date.now(), { cache: "no-store" })).text();
    const live = (t.match(/const BUILD = "([^"]+)"/) || [])[1];
    if (!live || live === BUILD || sessionStorage.getItem("upd") === live) return;
    sessionStorage.setItem("upd", live);
    const u = new URL(location.href); u.searchParams.set("v", live); location.replace(u.toString());
  } catch {}
}
checkUpdate();
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") checkUpdate(); });
const VIDEO_TYPES = ["Short", "Video", "Video Long", "TikTok", "Youtube"];
const MAX_BYTES = 150 * 1024 * 1024;           // limite d'un lien d'envoi Dropbox
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem("studio." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("studio." + k, JSON.stringify(v)); } catch {} }
};

/* ---------- clé d'accès : arrive une fois par le lien #k=… ---------- */
(() => {
  const m = location.hash.match(/k=([0-9a-f]{32})/);
  if (m) store.set("key", m[1]);
})();
let KEY = store.get("key", "");

const S = { rows: [], lang: store.get("lang", "all"), sel: new Set(), queue: [], loading: true };

function toast(m, ms = 3000) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, ms); }

async function api(a, fields = {}, tries = a === "gen" ? 2 : 1) {
  const body = new URLSearchParams({ k: KEY, a, ...fields });
  const r = await fetch(API, { method: "POST", body });
  const txt = await r.text();
  if (txt === "Accepted" && a === "gen") {
    if (tries > 1) { toast("Claude est surchargé, nouvel essai…", 5000); await new Promise(res => setTimeout(res, 8000)); return api(a, fields, tries - 1); }
    throw new Error("Claude est momentanément surchargé (rien à voir avec ta clé). Réessaie dans une minute.");
  }
  let j; try { j = JSON.parse(txt); } catch { throw new Error(txt === "Accepted" ? "Make a refusé la demande (clé d'accès ou données invalides). Si ça persiste, rouvre le lien d'installation." : "Réponse inattendue : " + txt.slice(0, 120)); }
  if (j && j.status && j.status >= 300) throw new Error("Notion a refusé (" + j.status + ")");
  return j;
}

/* ---------- données ---------- */
const plain = arr => (arr || []).map(t => t.plain_text).join("");
const spoken = s => String(s || "").replace(/^\s*\[[^\]]*\]\s*$/gm, "").replace(/\[[^\]]*\]/g, "").replace(/\*\*/g, "").replace(/\n{3,}/g, "\n\n").trim();
function row(p) {
  const pr = p.properties || {};
  return {
    id: p.id.replace(/-/g, ""),
    name: plain(pr.Name?.title) || "Sans titre",
    lang: pr.Language?.select?.name || "",
    type: pr.Type?.select?.name || "",
    script: spoken(plain(pr.Script?.rich_text)),
    desc: plain(pr.Description?.rich_text),
    tags: plain(pr.Hashtags?.rich_text),
    promo: !!pr["Promo app"]?.checkbox,
    hook: plain(pr["Texte écran"]?.rich_text),
    link: pr.Link?.url || "",
    src: pr["Source URL"]?.url || "",
    cost: pr["Coût ($)"]?.number ?? null,
    fx: (() => { try { const j = JSON.parse(plain(pr["Scènes"]?.rich_text) || "null"); return j && ((Array.isArray(j.scenes) && j.scenes.length) || (j.style === "r7" && Array.isArray(j.plans) && j.plans.length)) ? j : null; } catch { return null; } })()
  };
}
async function load() {
  S.loading = true; render();
  try {
    const res = await api("list");
    S.rows = (Array.isArray(res) ? res : []).map(row).filter(r => VIDEO_TYPES.includes(r.type) && r.script.length > 10);
    S.err = null;
    setTimeout(resumeRenders, 0);
  } catch (e) { S.err = e.message; }
  S.loading = false; render();
}

/* ---------- liste ---------- */
const isAr = r => r.lang === "عربي";
const words = s => s.split(/\s+/).filter(Boolean).length;
const secs = r => Math.max(5, Math.round(words(r.script) / (isAr(r) ? 2.2 : 2.5)));
function render() {
  document.querySelectorAll("#langSeg button").forEach(b => b.classList.toggle("on", b.dataset.l === S.lang));
  const msg = $("#msg");
  if (!KEY) {
    msg.innerHTML = `<div class="err">Connecte le Studio : colle ta clé d'accès (ou le lien d'installation complet) puis « Connecter ».
      <div class="row" style="margin-top:10px"><input id="kIn" placeholder="clé ou lien #k=…" autocapitalize="off" autocorrect="off"><button class="pri" id="kGo" style="flex:none">Connecter</button></div></div>`;
    $("#kGo").onclick = () => {
      const m = $("#kIn").value.match(/[0-9a-f]{32}/i); if (!m) { toast("Clé introuvable dans ce texte."); return; }
      KEY = m[0].toLowerCase(); store.set("key", KEY); history.replaceState(null, "", location.pathname + "#k=" + KEY); load(); resumeQueue();
    };
    $("#list").innerHTML = ""; return;
  }
  else msg.innerHTML = S.err ? `<div class="err">${esc(S.err)} <button class="ghost" onclick="load()">Réessayer</button></div>` : "";
  const rows = S.rows.filter(r => S.lang === "all" || r.lang === S.lang);
  $("#list").innerHTML = S.loading ? `<div class="empty">Chargement des scripts…</div>` :
    !rows.length ? `<div class="empty">Aucun script à tourner. Appuie sur « ＋ Scripts ».</div>` :
    rows.map(r => isR7(r) ? r7Card(r) : `<div class="card">
      ${r.fx ? `<span style="width:24px;flex:none;text-align:center" aria-hidden="true">🎞</span>` : `<input type="checkbox" data-sel="${r.id}" ${S.sel.has(r.id) ? "checked" : ""} aria-label="Ajouter au tournage">`}
      <div class="b"><div class="t" dir="auto" data-edit="${r.id}">${esc(r.name)} <span class="small">✎</span></div>
        <div class="meta"><span class="pill">${isAr(r) ? "AR" : r.lang === "Francais" ? "FR" : esc(r.lang || "?")}</span>
        <span class="pill">~${secs(r)} s</span>
        ${r.desc && r.tags ? `<span class="pill ok">texte prêt</span>` : `<span class="pill warn">texte auto</span>`}
        ${r.fx && r.link ? `<span class="pill ok">vidéo prête</span>` : ""}${r.cost != null ? `<span class="pill">💲 ${money(r.cost)}</span>` : ""}${r.promo ? `<span class="pill">promo app</span>` : ""}${r.fx ? `<span class="pill">sans visage · ${esc(STYLES[r.fx.style]?.label || "")}</span>` : ""}</div></div>
      ${r.fx ? `<button class="go" data-make="${r.id}" aria-label="${r.link ? "Refaire" : "Produire"} la vidéo sans visage">🎞</button>` : `<button class="go" data-one="${r.id}" aria-label="Tourner ce script">▶</button>`}</div>
      ${r.fx && r.link ? `<div class="vbox" data-v="${esc(r.link)}" style="margin:-4px 0 12px"><div class="row"><button class="ghost vplay">▶ Regarder</button><button class="pri" data-pub="${r.id}">🚀 Publier</button></div></div>` : ""}`).join("");
  const n = S.sel.size;
  $("#bShoot").textContent = `Tourner (${n})`; $("#bShoot").disabled = !n;
  $("#bDel").hidden = !n; $("#bDel").textContent = `🗑 ${n}`;
  renderQueue();
}
$("#langSeg").onclick = e => { const l = e.target.dataset.l; if (!l) return; S.lang = l; store.set("lang", l); render(); };
$("#list").onclick = e => {
  const c = e.target.closest("[data-sel]"); if (c) { c.checked ? S.sel.add(c.dataset.sel) : S.sel.delete(c.dataset.sel); render(); return; }
  const g = e.target.closest("[data-one]"); if (g) openPlan([g.dataset.one]);
  const pb = e.target.closest("[data-pub]"); if (pb) { const r = S.rows.find(x => x.id === pb.dataset.pub); isR7(r) ? publishR7(r) : publishFx(r); return; }
  const tr = e.target.closest("[data-tr]"); if (tr) { translateVideo(S.rows.find(x => x.id === tr.dataset.tr), tr); return; }
  const vo = e.target.closest("[data-voice]"); if (vo) { openVoice(S.rows.find(r => r.id === vo.dataset.voice)); return; }
  const rw = e.target.closest("[data-rwait]"); if (rw) { const r = S.rows.find(x => x.id === rw.dataset.rwait); if (r) watchRender(r, true); return; }
  const mk = e.target.closest("[data-make]"); if (mk) makeFaceless(S.rows.find(r => r.id === mk.dataset.make));
  const ed = e.target.closest("[data-edit]"); if (ed) openEdit(S.rows.find(r => r.id === ed.dataset.edit));
};
$("#bShoot").onclick = () => openPlan(S.rows.filter(r => S.sel.has(r.id)).map(r => r.id));
$("#bDel").onclick = () => removeRows([...S.sel]);

/* ---------- supprimer des vidéos (doublons, sujets abandonnés) : rangées dans Notion sous « Supprimé », récupérables ---------- */
async function removeRows(ids) {
  const rows = S.rows.filter(r => ids.includes(r.id)); if (!rows.length) return;
  if (!confirm(rows.length === 1 ? `Supprimer « ${rows[0].name} » de la liste ?` : `Supprimer ces ${rows.length} vidéos de la liste ?`)) return;
  const setStage = (r, name) => api("update", { id: r.id, props: JSON.stringify({ "Pipeline Stage": { select: { name } } }) });
  const done = [];
  for (const r of rows) { try { await setStage(r, "Supprimé"); done.push(r); } catch (e) { toast(e.message); } }
  if (!done.length) return;
  S.rows = S.rows.filter(r => !done.includes(r)); done.forEach(r => S.sel.delete(r.id)); $("#sheet").innerHTML = ""; render();
  const t = $("#toast"); clearTimeout(toast.t);
  t.innerHTML = `${done.length === 1 ? "Vidéo supprimée" : done.length + " vidéos supprimées"} <button class="ghost" id="tUndo" style="margin-left:8px;padding:6px 12px;width:auto;color:#F2A541;font-weight:700;border:1px solid #F2A541;border-radius:10px">Annuler</button>`; t.hidden = false;
  toast.t = setTimeout(() => t.hidden = true, 7000);
  $("#tUndo").onclick = async () => {
    t.hidden = true;
    for (const r of done) { try { await setStage(r, "Script"); } catch {} }
    load(); toast("Remis dans la liste.");
  };
}

/* ---------- modifier un script ---------- */
function openEdit(r) {
  if (!r) return;
  $("#sheet").innerHTML = `<div class="sheet"><div>
    <h2 style="margin:0 0 4px" dir="auto">${esc(r.name)}</h2>

/* ---------- incrustation : la vidéo est enregistrée depuis un canvas 1080×1920 qui ajoute l'accroche ---------- */
const HOOK_MS = 3000;
const C = { cv: null, x: null, raf: 0, t0: 0, hook: "", ar: false, on: false };
const canComposite = () => typeof HTMLCanvasElement.prototype.captureStream === "function";
function hookLines(x, text, maxW) {
  const lines = []; let line = "";
  for (const w of text.split(/\s+/).filter(Boolean)) {
    const t = line ? line + " " + w : w;
    if (x.measureText(t).width > maxW && line) { lines.push(line); line = w; } else line = t;
  }
  if (line) lines.push(line); return lines.slice(0, 3);
}
function drawHook(x, W, H, el) {
  const pop = Math.min(1, el / 220), fade = el > HOOK_MS - 250 ? Math.max(0, (HOOK_MS - el) / 250) : 1;
  const size = 108, lh = size * 1.22, padX = 32, padY = 16;
  x.save(); x.globalAlpha = fade;
  x.font = `900 ${size}px -apple-system, "SF Pro Display", "Noto Sans Arabic", "Geeza Pro", Arial, sans-serif`;
  x.direction = C.ar ? "rtl" : "ltr"; x.textAlign = "center"; x.textBaseline = "middle";
  const lines = hookLines(x, C.hook, W * 0.8), cy = H * 0.24;
  x.translate(W / 2, cy); x.scale(0.85 + 0.15 * pop, 0.85 + 0.15 * pop); x.rotate(-0.02);
  lines.forEach((l, i) => {
    const y = (i - (lines.length - 1) / 2) * lh, w = x.measureText(l).width;
    x.fillStyle = "#ffe14d"; x.beginPath(); x.roundRect(-w / 2 - padX, y - size / 2 - padY, w + padX * 2, size + padY * 2, 18); x.fill();
    x.fillStyle = "#111"; x.fillText(l, 0, y + 4);
  });
  x.restore();
}
function compose() {
  const v = $("#cam"), W = 1080, H = 1920, x = C.x;
  if (v.videoWidth) {
    const s = Math.max(W / v.videoWidth, H / v.videoHeight), w = v.videoWidth * s, h = v.videoHeight * s;
    x.drawImage(v, (W - w) / 2, (H - h) / 2, w, h);
  }
  const el = performance.now() - C.t0;
  if (C.hook && el < HOOK_MS) drawHook(x, W, H, el);
  $("#hookPrev").style.display = C.hook && el < HOOK_MS ? "block" : "none";
  if (C.on) C.raf = requestAnimationFrame(compose);
}
function recStream(r) {
  if (P.audio || !canComposite()) return P.stream;
  if (!C.cv) { C.cv = document.createElement("canvas"); C.cv.width = 1080; C.cv.height = 1920; C.x = C.cv.getContext("2d"); }
  C.hook = (r.hook || "").trim(); C.ar = isAr(r); C.t0 = performance.now(); C.on = true; compose();
  return new MediaStream([...C.cv.captureStream(30).getVideoTracks(), ...P.stream.getAudioTracks()]);
}
function stopCompose() { C.on = false; cancelAnimationFrame(C.raf); $("#hookPrev").style.display = "none"; }
function showHook(r) {
  $("#hookChip").textContent = r.hook ? `🪝 À l'écran (3 s) : « ${r.hook} » ✎` : "🪝 Ajouter un texte d'accroche ✎";
  $("#hookPrev").innerHTML = r.hook ? `<span>${esc(r.hook)}</span>` : "";
}

/* ---------- file d'envoi : Dropbox puis programmation Notion ---------- */
// Chaque prise gardée est rangée dans IndexedDB jusqu'à sa programmation : si Safari se ferme, l'envoi reprend à la réouverture.
const idb = (() => {
  let p;
  const db = () => p ??= new Promise((ok, ko) => { const r = indexedDB.open("studio", 1); r.onupgradeneeded = () => r.result.createObjectStore("takes", { keyPath: "key" }); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); });
  const tx = async (mode, fn) => { const d = await db(); return new Promise((ok, ko) => { const t = d.transaction("takes", mode); const req = fn(t.objectStore("takes")); t.oncomplete = () => ok(req?.result); t.onerror = () => ko(t.error); }); };
  return { put: v => tx("readwrite", s => s.put(v)).catch(() => {}), del: k => tx("readwrite", s => s.delete(k)).catch(() => {}), all: () => tx("readonly", s => s.getAll()).catch(() => []) };
})();
const saveQ = q => idb.put({ key: q.key, r: q.r, blob: q.blob, ext: q.ext, date: q.date, t: q.t, file: q.file || "", prod: q.prod || "cam" });
async function resumeQueue() {
  for (const v of await idb.all() || []) {
    if (S.queue.some(q => q.key === v.key)) continue;
    const q = { ...v, state: "reprise…", ok: false, err: false }; S.queue.push(q); renderQueue(); runQueue(q);
  }
}
function renderQueue() {
  if (!S.queue.length) { $("#queue").innerHTML = ""; return; }
  $("#queue").innerHTML = `<div class="small" style="margin-bottom:4px">Envois — garde le Studio ouvert jusqu'à ✓</div>` + S.queue.map((q, i) =>
    `<div class="q"><span dir="auto">${esc(q.r.name)}</span><span class="st ${q.ok ? "ok" : q.err ? "bad" : ""}">${esc(q.state)}${q.err ? ` <button class="ghost" data-retry="${i}" style="padding:4px 10px">Réessayer</button>` : ""}</span></div>`).join("");
}
$("#queue").onclick = e => { const b = e.target.closest("[data-retry]"); if (b) { const q = S.queue[+b.dataset.retry]; q.err = false; runQueue(q); } };
function enqueue(r, blob, mime, date, prod = "cam") {
  const q = { key: r.id + "-" + Date.now(), r, blob, prod, ext: /mp4/.test(mime) ? "mp4" : /quicktime/.test(mime) ? "mov" : "webm", date, t: String(Math.floor(Date.now() / 1000)), state: "en attente", ok: false, err: false };
  S.queue.push(q); renderQueue(); saveQ(q).then(() => runQueue(q));
}
function setQ(q, state) { q.state = state; renderQueue(); }
function putFile(link, blob, onp) {
  return new Promise((ok, ko) => {
    const x = new XMLHttpRequest(); x.open("POST", link); x.setRequestHeader("Content-Type", "application/octet-stream");
    x.upload.onprogress = e => e.lengthComputable && onp(Math.round(e.loaded / e.total * 100));
    x.onload = () => x.status < 300 ? ok() : ko(new Error("Dropbox " + x.status));
    x.onerror = () => ko(new Error("réseau")); x.send(blob);
  });
}
async function ensureText(r) {
  if (r.desc && r.tags) return;
  const out = await api("gen", { prompt: metaPrompt(r) });
  const j = parseJSON(out.text);
  r.desc = r.desc || String(j?.description || "").slice(0, 1800);
  r.tags = r.tags || String(j?.hashtags || "").slice(0, 400);
  await api("update", { id: r.id, props: JSON.stringify({ Description: rt(r.desc), Hashtags: rt(r.tags) }) });
}
async function runQueue(q) {
  try {
    if (!q.file) {
      setQ(q, "texte…"); await ensureText(q.r);

      const up = await api("upload", { id: q.r.id, ext: q.ext, t: q.t });
      if (!up.link) throw new Error("pas de lien d'envoi");
      await putFile(up.link, q.blob, p => setQ(q, "envoi " + p + " %"));
      q.file = up.file; saveQ(q);
    }
    setQ(q, "programmation…");
    await api("done", { id: q.r.id, file: q.file, date: q.date, prod: q.prod || "cam", sub: store.get("subs", true) ? "1" : "", lang: isAr(q.r) ? "ar" : "fr" });
    q.ok = true; q.blob = null; idb.del(q.key);
    if ((q.prod || "cam") === "cam" && q.r.cost == null) api("update", { id: q.r.id, props: JSON.stringify({ "Coût ($)": { number: PRICE.subMin } }) }).catch(() => {});
    const when = new Date(q.date);
    setQ(q, when - Date.now() < 60000 ? "✓ part dans les 30 min" : "✓ " + when.toLocaleString("fr-FR", { weekday: "short", day: "numeric", hour: "2-digit", minute: "2-digit" }));
    S.rows = S.rows.filter(x => x.id !== q.r.id); render();
  } catch (e) { q.err = true; setQ(q, "échec : " + e.message); }
}
window.addEventListener("beforeunload", e => { if (S.queue.some(q => !q.ok)) { e.preventDefault(); e.returnValue = ""; } });

function parseJSON(t) {
  const s = String(t || ""); const a = s.indexOf("["), o = s.indexOf("{");
  const start = a >= 0 && (o < 0 || a < o) ? a : o; const end = Math.max(s.lastIndexOf("]"), s.lastIndexOf("}"));
  try { return JSON.parse(s.slice(start, end + 1)); } catch { return null; }
}

async function falRun(model, input) {
  const r = await api("fal", { model, input: JSON.stringify(input) });
  if (r.status !== 200) throw new Error(`fal ${r.status} : ${JSON.stringify(r.data).slice(0, 140)}`);
  return r.data;
}
async function falQueue(model, input, firstWait = 25000) {
  const q = await api("falq", { model, input: JSON.stringify(input) });
  if (q.status >= 300 || !q.data?.status_url) throw new Error(`fal ${q.status} : ${JSON.stringify(q.data).slice(0, 140)}`);
  await new Promise(ok => setTimeout(ok, firstWait));
  for (let i = 0; i < 80; i++) {
    const st = await api("falget", { url: q.data.status_url });
    if (st.data?.status === "COMPLETED") {
      const res = await api("falget", { url: q.data.response_url });
      if (res.status >= 300) throw new Error(`fal ${res.status} : ${JSON.stringify(res.data).slice(0, 140)}`);
      return res.data;
    }
    if (st.status >= 400) throw new Error(`fal ${st.status} : ${JSON.stringify(st.data).slice(0, 140)}`);
    await new Promise(ok => setTimeout(ok, 8000));
  }
  throw new Error("délai dépassé chez fal");
}

async function pool(items, n, fn) {
  const out = new Array(items.length); let i = 0;
  await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => { while (i < items.length) { const k = i++; out[k] = await fn(items[k], k); } }));

function r7Prompt(o) {
  return `Tu es le scénariste du Dr Fehmi, médecin psychiatre (psychologie du quotidien, santé mentale, addictions). Vidéo courte SANS VISAGE : sa voix + motion design au style ambre avec un personnage unique. Objectif : AIDER vraiment avec une technique prouvée, et garder l'attention jusqu'à la dernière seconde.
Sujet : ${o.topic}
${o.version ? `Version retenue (à suivre fidèlement, avec tes propres mots) : ${o.version}` : ""}
Langue de la voix off : ${o.lang === "ar" ? "arabe tunisien (darija) naturel et clair, compréhensible dans tout le monde arabe" : "français parlé, tutoiement, phrases courtes"}.

TECHNIQUES PROUVÉES (choisis LA plus adaptée au sujet, explique-la précisément, étapes concrètes ; cite uniquement sa source, telle quelle) :
${TECHNIQUES.map(t => `- [${t.id}] ${t.nom} — pour : ${t.pour}. Étapes : ${t.etapes}. Ce que l'étude montre : ${t.preuve}. Source : ${t.source}`).join("\n")}
${o.source ? `Source supplémentaire fournie : ${o.source}` : ""}
Interdit : inventer un chiffre, une étude ou un pourcentage ; poser un diagnostic ; conseil médical dangereux. Si sujet de santé : une phrase invite à consulter un professionnel.

RÉTENTION MAXIMALE (règles strictes) :
- Plan 1 (moins de 2,5 s) : accroche qui crée un manque. Formules : douleur précise (« Tu te réveilles à 3 h du matin ? »), contre-intuitif (« Arrête de te dire de te calmer »), promesse chiffrée concrète (« 10 secondes pour… »). Jamais de bonjour ni de présentation.
- Plan 2 : boucle ouverte (« la 2e étape, presque personne ne la fait »), refermée seulement à la fin.
- 9 à 11 plans de 2,5 à 5 s : un changement visuel toutes les 3 à 5 secondes. Phrases de 12 mots maximum, tutoiement, une idée par plan.
- Durée : 40 à 50 secondes une fois montée, soit 85 à 100 mots AU TOTAL (compte-les). Chaque mot doit servir : pas de remplissage.
- Une rupture de rythme au milieu : un plan "bigword" OU "stamp".
- Vers 35-45 % de la vidéo : appel à commenter UN mot ("cta").
- La technique : étapes numérotées et concrètes ("count", "check" ou "timer"), puis la source sur un "card".
- Avant-dernier plan : récap en "check" (2-3 points) ou "quote" (phrase à retenir).
- Dernier plan : « Abonne-toi… » + une dernière phrase qui renvoie à la première (la vidéo boucle).

CHAQUE PLAN :
- "say" : texte dit (1 ou 2 phrases courtes).
- "title" : titre à l'écran, 2 à 6 mots, accordé avec le texte dit (genre/nombre), neutre si possible. Titre du plan 1 = titre-accroche (miniature).
- "img" : UNE pose du pack, qui illustre littéralement le plan ; varie (jamais 3 fois la même de suite) : ${Object.entries(PACK).map(([k, v]) => `${k} (${v})`).join(" ; ")}.
  Si aucune pose ne convient (2 plans max) : ajoute "newimg" = description en anglais de la pose du même personnage (sans texte).
- "gfx" (au moins 7 plans animés, jamais le même deux fois de suite) :
  "ring" (anneau, idéal plan 1) · "pulse" (tension, battements de cœur) · "breath" (cercle de respiration ; "steps": 2-3 étiquettes en MAJUSCULES dont le dernier mot est prononcé) · "cta" ("cta": le mot à écrire) · "ecg" (cœur qui ralentit) · "card" ("card": {"b": "ce que l'étude montre en 8 mots max", "i": "la source exacte"}) · "count" ("count": nombre d'étapes) · "check" ("items": [{"t": "3-5 mots", "ok": true|false}] 2 ou 3) · "split" ("left": {"label": "MYTHE" ou "AVANT", "t": "4-7 mots"}, "right": {"label": "VÉRITÉ" ou "APRÈS", "t": "4-7 mots"}) · "quote" ("quote": phrase à retenir, 12 mots max) · "bigword" ("word": UN mot-choc prononcé dans le plan) · "stamp" ("stamp": "FAUX", "VRAI" ou "MYTHE", mot prononcé dans le plan) · "timer" ("seconds": 3 à 10, quand on demande de faire l'exercice maintenant) · "none".
- "hot" : 1 à 3 mots exacts du "say" à colorer.
MUSIQUE : choisis "music" parmi ${Object.entries(MUSICS).map(([k, v]) => `${k} = ${v}`).join(" ; ")}.${o.lang === "ar" ? " En arabe, préfère oriental ou calme." : ""}
Réponds UNIQUEMENT en JSON : {"technique": "id", "title": "titre YouTube 60 caractères max", "hook": "texte écran 3 à 6 mots", "description": "2-3 phrases + question, sans hashtags", "hashtags": "5 hashtags", "ghost": "UN mot-thème en majuscules", "music": "calme", "plans": [{"say": "", "title": "", "img": "", "gfx": "", "hot": []}]}`;
}
function cleanPlans(arr) {
  return (arr || []).filter(p => p && String(p.say || "").trim()).slice(0, 12).map(p => {
    const o = { say: String(p.say).trim(), title: String(p.title || "").slice(0, 60), img: PACK[p.img] ? p.img : "standing",
      gfx: ["ring", "pulse", "breath", "cta", "ecg", "card", "count", "check", "split", "quote", "bigword", "stamp", "timer", "none"].includes(p.gfx) ? p.gfx : "none", hot: (p.hot || []).map(String).slice(0, 4) };
    if (o.gfx === "check") o.items = (p.items || []).slice(0, 3).map(x => ({ t: String(x?.t || "").slice(0, 40), ok: x?.ok !== false }));
    if (o.gfx === "split") { o.left = { label: String(p.left?.label || "").slice(0, 14), t: String(p.left?.t || "").slice(0, 50) }; o.right = { label: String(p.right?.label || "").slice(0, 14), t: String(p.right?.t || "").slice(0, 50) }; }
    if (o.gfx === "quote") o.quote = String(p.quote || "").slice(0, 90);
    if (o.gfx === "bigword") o.word = String(p.word || "").slice(0, 14);
    if (o.gfx === "stamp") o.stamp = String(p.stamp || "").slice(0, 10);
    if (o.gfx === "timer") o.seconds = Math.max(3, Math.min(10, +p.seconds || 5));
    if (p.newimg) o.newimg = String(p.newimg).slice(0, 300);
    if (o.gfx === "breath") o.steps = (p.steps || []).map(String).slice(0, 3);
    if (o.gfx === "cta") o.cta = String(p.cta || "").slice(0, 20);
    if (o.gfx === "card") o.card = { b: String(p.card?.b || "").slice(0, 60), i: String(p.card?.i || "").slice(0, 80) };
    if (o.gfx === "count") o.count = Math.max(2, Math.min(5, +p.count || 3));
    return o;
  });
}
// Claude écrit les plans puis la vidéo arrive dans « À tourner » (procédure habituelle du Studio)
async function createR7(o, tries = 2) {
  const out = await api("gen", { prompt: r7Prompt(o) });
  const j = parseJSON(out.text);
  const plans = cleanPlans(j?.plans);
  if (plans.length < 4) {
    if (tries > 1) { toast("Réponse de Claude incomplète, nouvel essai…", 5000); return createR7(o, tries - 1); }
    throw new Error("Claude n'a pas rendu un script complet deux fois de suite. Réessaie dans une minute.");
  }
  const lang = o.lang === "ar" ? "عربي" : "Francais";
  const res = await api("create", { props: JSON.stringify({
    Name: { title: [{ text: { content: String(j.title || o.topic).slice(0, 200) } }] },
    Script: rt(plans.map(p => p.say).join("\n\n")), Description: rt(j.description), Hashtags: rt(j.hashtags), "Texte écran": rt(j.hook || plans[0].title),
    "Scènes": rt(JSON.stringify({ style: "r7", ghost: String(j.ghost || "").slice(0, 20), music: MUSICS[j.music] ? j.music : "calme", technique: String(j.technique || ""), plans })), Production: { select: { name: "Visuels IA" } },
    Type: { select: { name: "Short" } }, Language: { select: { name: lang } }, Channel: { select: { name: lang === "عربي" ? "Dr Fehmi AR" : "Fehmi Tlaies FR" } },
    "Pipeline Stage": { select: { name: "Script" } }, ...(o.link ? { "Source URL": { url: o.link } } : {})
  }) });
  return res.id;
}

/* ---------- onglet Radar : idées détectées → versions A/B → script ---------- */
async function loadRadar() {
  const el = $("#radar"); el.innerHTML = `<div class="empty">Chargement du radar…</div>`;
  try {
    const res = await api("rlist").catch(e => ({ status: 403, error: e.message }));
    if (res.status === 403) {
      el.innerHTML = `<div class="err">Le Studio n'a pas encore accès au Radar. Dans Notion, ouvre la page « Radar Viral » › ••• › Connexions › ajoute <b>Make</b>. Puis reviens ici.</div>`; return;
    }
    const ideas = (res.results || []).map(p => {
      const pr = p.properties || {};
      return { id: p.id.replace(/-/g, ""), n: pr["N°"]?.number, hook: plain(pr["Hook adapté"]?.title), lang: pr.Langue?.select?.name || "fr",
        a: plain(pr["Version A"]?.rich_text), b: plain(pr["Version B"]?.rich_text), src: plain(pr["Source scientifique"]?.rich_text),
        views: pr.Vues?.number, out: pr["Score outlier"]?.number, sens: !!pr["⚠️ Sensible"]?.checkbox, link: pr.Lien?.url || "", acc: plain(pr.Compte?.rich_text) };
    }).filter(i => S.lang === "all" || (i.lang === "ar") === (S.lang === "عربي"));
    S.ideas = ideas;
    const k = v => v == null ? "" : v >= 1e6 ? (v / 1e6).toFixed(1).replace(".0", "") + " M" : v >= 1e3 ? Math.round(v / 1e3) + " k" : v;
    el.innerHTML = !ideas.length ? `<div class="empty">Aucune idée en attente. Le radar tourne le lundi et le jeudi.</div>` : ideas.map(i => `<div class="card idea"><div class="b">
        <div class="t" dir="auto">${i.n ? i.n + ". " : ""}${esc(i.hook)}</div>
        <div class="meta"><span class="pill">${i.lang.toUpperCase()}</span>${i.views ? `<span class="pill">👁 ${k(i.views)}</span>` : ""}${i.out ? `<span class="pill">×${Math.round(i.out)} vs moyenne</span>` : ""}${i.sens ? `<span class="pill warn">⚠️ sensible</span>` : ""}${i.link ? `<a class="pill" href="${esc(i.link)}" target="_blank" rel="noopener" style="color:inherit">source ${esc(i.acc)}</a>` : ""}</div>
        <div class="ab" dir="auto"><b>A</b> ${esc(i.a)}</div><div class="ab" dir="auto"><b>B</b> ${esc(i.b)}</div>
        <div class="acts"><button class="pri" data-take="${i.id}" data-v="A">Prendre A</button><button class="pri" data-take="${i.id}" data-v="B">Prendre B</button><button class="ghost" data-rej="${i.id}" aria-label="Rejeter cette idée">✕</button></div>
      </div></div>`).join("");
  } catch (e) { el.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
$("#radar").onclick = async e => {
  const rj = e.target.closest("[data-rej]");
  if (rj) { rj.disabled = true; await api("update", { id: rj.dataset.rej, props: JSON.stringify({ Statut: { select: { name: "Rejeté" } } }) }).catch(er => toast(er.message)); loadRadar(); return; }
  const b = e.target.closest("[data-take]"); if (!b) return;
  const i = S.ideas.find(x => x.id === b.dataset.take), v = b.dataset.v; if (!i) return;
  if (i.sens && !confirm("Sujet sensible (santé). Tu confirmes la création de cette vidéo ?")) return;
  document.querySelectorAll("#radar [data-take]").forEach(x => x.disabled = true); b.textContent = "Claude écrit…";
  try {
    await createR7({ topic: i.hook, version: v === "A" ? i.a : i.b, source: i.src && !/compléter|vérifier|observation/i.test(i.src) ? i.src : "", lang: i.lang, link: i.link });
    await api("update", { id: i.id, props: JSON.stringify({ Statut: { select: { name: "Envoyé au studio" } }, "Version choisie": { select: { name: v } }, Niveau: { select: { name: "Fiche" } } }) }).catch(() => {});
    toast("Script prêt dans « À tourner » : appuie sur 🎙 pour enregistrer ta voix.", 5000);
    load(); loadRadar();
  } catch (er) { toast(er.message); loadRadar(); }
};

    r.fx.music = $("#vMusic").value; r.fx.sfx = $("#vSfx").value === "1"; r.fx.speed = +$("#vSpeed").value;
    api("update", { id: r.id, props: JSON.stringify({ "Scènes": rt(JSON.stringify(r.fx)) }) }).catch(() => {});
  };
  document.querySelectorAll("[data-pose]").forEach(sel => sel.onchange = () => {
    const p = r.fx.plans[+sel.dataset.pose]; if (sel.value === "__new") return;
    p.img = sel.value; delete p.newimg; delete p.img_url;
    const im = document.querySelector(`[data-thumb="${sel.dataset.pose}"]`); im.src = `radar/pack/${sel.value}.jpg`; im.style.outline = "";
  });
  $("#vMusic").onchange = $("#vSfx").onchange = () => {};
  $("#vRec").addEventListener("click", keepChoices, { capture: true });
  $("#vClone").addEventListener("click", keepChoices, { capture: true });
  $("#vRec").onclick = () => { $("#sheet").innerHTML = ""; startShoot([r.id], store.get("plan", { mode: "now", time: "18:00" }), true); };
  $("#vClone").onclick = async () => {
    const b = $("#vClone"); b.disabled = true; b.textContent = "Voix clonée…";
    try {
      const text = r.fx.plans.map(p => p.say).join(" <#0.45#> ");
      const d = await falRun("fal-ai/minimax/speech-02-hd", { text, voice_setting: { voice_id: VOICE_ID, speed: 1, vol: 1, pitch: 0, emotion: "neutral" }, language_boost: isAr(r) ? "Arabic" : "French", output_format: "url" });
      if (!d.audio?.url) throw new Error("voix non générée");
      $("#sheet").innerHTML = ""; renderR7(r, { url: d.audio.url, cost: text.length * PRICE.tts });
    } catch (e) { b.disabled = false; b.textContent = "🤖 Voix clonée"; toast(e.message); }
  };
}
async function falUpload(blob, fname) {
  const ctype = (blob.type || "application/octet-stream").split(";")[0];
  const up = await api("falup", { ctype, fname });
  if (up.status !== 200) throw new Error("envoi refusé par fal");
  const res = await fetch(up.data.upload_url, { method: "PUT", headers: { "Content-Type": ctype }, body: blob });
  if (!res.ok) throw new Error("envoi : " + res.status);
  return up.data.file_url;
}
const b64 = s => btoa(unescape(encodeURIComponent(s)));
// Envoie la voix + les plans au montage GitHub, puis suit l'avancement
async function renderR7(r, src) {
  $("#fx").classList.add("on"); $("#fxv").style.display = "none"; $("#fxc").style.display = "none";
  $("#fxTitle").textContent = r.name; fxButtons(`<button class="ghost" id="fxClose">Fermer</button>`, { fxClose: closeFx });
  const steps = [["Voix", "run"], ["Images", "wait"], ["Montage (≈ 5 min, tu peux fermer le Studio)", "wait"]];
  const set = (i, st, label) => { steps[i][1] = st; if (label) steps[i][0] = label; fxSteps(steps); };
  fxSteps(steps);
  try {
    let cost = src.cost || 0;
    const voice = src.url || await falUpload(src.blob, "voix." + (/mp4|m4a|aac/.test(src.mime || src.blob.type) ? "m4a" : "webm"));
    set(0, "ok", src.url ? "Voix clonée" : "Ta voix"); set(1, "run");
    const plans = r.fx.plans;
    let changed = false;
    for (const p of plans.filter(p => p.newimg && !p.img_url)) {
      const d = await falRun("fal-ai/nano-banana/edit", { prompt: `Use exactly the same character as the reference image. New square illustration. Pose and scene: ${p.newimg}. ${R7_LOOK}`, image_urls: [HERO], num_images: 1, aspect_ratio: "1:1" });
      p.img_url = d.images?.[0]?.url; cost += PRICE.img; changed = true;
    }
    if (changed) api("update", { id: r.id, props: JSON.stringify({ "Scènes": rt(JSON.stringify(r.fx)) }) }).catch(() => {});
    set(1, "ok", changed ? "Images (nouvelles poses créées)" : "Images du pack"); set(2, "run");
    const t = String(Math.floor(Date.now() / 1000));
    const job = { lang: isAr(r) ? "ar" : "fr", ghost: r.fx.ghost || "", music: r.fx.music || "calme", sfx: r.fx.sfx !== false, speed: r.fx.speed || 1.2, voice, plans: plans.map(({ newimg, ...p }) => p) };
    let res;
    try { res = await api("render", { id: r.id, t, ref: REF, job: b64(JSON.stringify(job)) }); }
    catch (e) { throw new Error(/refusé la demande/.test(e.message) ? "Montage pas encore activé : la clé GitHub n'est pas dans Make (voir la liste d'étapes)." : e.message); }
    if (!res.ok) throw new Error("GitHub a refusé le montage (" + (res.status || "?") + ") : vérifie la clé « GitHub Studio » dans Make.");
    rx.set(r.id, { file: `${r.id}-${t}.mp4`, name: `${r.id}-${t}`, cost: +cost.toFixed(2), at: Date.now() });
    render(); watchRender(r, true);
  } catch (e) {
    const i = steps.findIndex(x => x[1] === "run"); if (i >= 0) steps[i][1] = "err"; fxSteps(steps);
    fxButtons(`<button class="ghost" id="fxClose2">Fermer</button><button class="pri" id="fxRetry">Réessayer</button>`, { fxClose2: closeFx, fxRetry: () => renderR7(r, src) });
    toast(e.message);
  }
}
// Suivi du montage : l'API publique GitHub dit si le rendu est fini (sans clé)
const watching = new Set();
async function watchRender(r, show) {
  const job = rx.get(r.id); if (!job) return;
  if (show) {
    $("#fx").classList.add("on"); $("#fxv").style.display = "none"; $("#fxc").style.display = "none"; $("#fxTitle").textContent = r.name;
    fxButtons(`<button class="ghost" id="fxClose">Fermer (le montage continue)</button>`, { fxClose: closeFx });
  }
  if (watching.has(r.id)) return; watching.add(r.id);
  const step = msg => { if ($("#fx").classList.contains("on") && $("#fxTitle").textContent === r.name) fxSteps([["Voix", "ok"], ["Images", "ok"], [msg, "run"]]); };
  try {
    for (let k = 0; k < 90; k++) {
      const min = Math.max(0, Math.round((Date.now() - job.at) / 60000));
      let run;
      try {
        const g = await (await fetch(`https://api.github.com/repos/${REPO}/actions/runs?event=workflow_dispatch&per_page=30`)).json();
        run = (g.workflow_runs || []).find(x => x.display_title === "radar " + job.name);
      } catch {}
      step(run ? (run.status === "completed" ? "Vidéo terminée, récupération…" : `Montage en cours… ${min} min`) : `Montage en attente… ${min} min`);
      if (run?.status === "completed") {
        if (run.conclusion !== "success") throw new Error("le montage a échoué sur GitHub");
        const l = await api("rlink", { file: job.file });
        if (l.status !== 200 || !l.url) throw new Error("vidéo introuvable dans Dropbox");
        r.link = l.url; r.cost = job.cost;
        await api("update", { id: r.id, props: JSON.stringify({ Link: { url: l.url }, "Coût ($)": { number: job.cost } }) }).catch(() => {});
        job.done = true; rx.set(r.id, job); render();
        if ($("#fx").classList.contains("on") && $("#fxTitle").textContent === r.name) {
          fxSteps([["Voix", "ok"], ["Images", "ok"], [`Montage — coût ${money(job.cost)}`, "ok"]]);
          const v = $("#fxv"); v.src = streamUrl(l.url); v.style.display = "block";
          fxButtons(`<button class="ghost" id="fxRedo">↺ Refaire la voix</button><button class="pri" id="fxKeep">✓ Publier</button>`, {
            fxRedo: () => { closeFx(); openVoice(r); }, fxKeep: async () => { closeFx(); await publishR7(r); } });
        } else toast("Vidéo prête : " + r.name, 5000);
        return;
      }
      if (Date.now() - job.at > 40 * 60000) throw new Error("montage trop long : réessaie");
      await new Promise(ok => setTimeout(ok, Date.now() - job.at < 150000 ? 150000 - (Date.now() - job.at) : 30000));
    }
  } catch (e) {
    rx.del(r.id); render(); toast(e.message, 6000);
    if ($("#fx").classList.contains("on") && $("#fxTitle").textContent === r.name)
      fxButtons(`<button class="ghost" id="fxClose2">Fermer</button><button class="pri" id="fxRetry">Refaire la voix</button>`, { fxClose2: closeFx, fxRetry: () => { closeFx(); openVoice(r); } });
  } finally { watching.delete(r.id); }
}
// Publication : la vidéo est déjà dans Dropbox, on la programme directement (sous-titres déjà incrustés, étiquette IA cochée)
async function publishR7(r) {
  // fichier Dropbox : mémorisé sur ce téléphone, sinon retrouvé dans le lien (autre appareil)
  const job = rx.get(r.id) || { file: (decodeURIComponent(r.link || "").match(/\/([0-9a-f]{32}-\d+\.mp4)(\?|$)/) || [])[1] };
  if (!job?.file) { toast("Vidéo introuvable : refais la voix avec 🎙."); return; }
  try {
    await api("done", { id: r.id, file: job.file, date: publishDate(r, store.get("plan", { mode: "now", time: "18:00" })), prod: "ia", sub: "", lang: isAr(r) ? "ar" : "fr" });
    rx.del(r.id); S.rows = S.rows.filter(x => x.id !== r.id); render();
    toast("Programmée : part sur TikTok + YouTube à l'heure prévue.", 4000);
  } catch (e) { toast(e.message); }
}
// Montages lancés avant une fermeture du Studio : on reprend le suivi en arrière-plan
function resumeRenders() { for (const r of S.rows) if (isR7(r) && !r.link && rx.get(r.id)) watchRender(r, false); }


render();
if (KEY) { load(); resumeQueue(); } else { S.loading = false; render(); }
</script>
